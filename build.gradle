plugins { id 'base' }

version = providers.gradleProperty('releaseVersion').get()

def licenseFiles = files('LICENSE', 'LICENSE-MIT', 'LICENSE-APACHE', 'THIRD-PARTY-NOTICES.md')

def extensions = subprojects.findAll { it.name in ['VnaolteFirmware', 'mtk-mddb-tools'] }

configure(extensions) {
    def ghidraBuild = file(providers.gradleProperty('ghidraInstallDir').get() + '/support/buildExtension.gradle').canonicalFile
    if (!ghidraBuild.isFile()) {
        throw new GradleException('Not a Ghidra distribution: ' + ghidraBuild.parentFile.parentFile)
    }
    apply from: ghidraBuild
    tasks.register('compileGhidraScripts', JavaCompile) {
        source = fileTree('ghidra_scripts') { include '**/*.java' }
        classpath = sourceSets.main.compileClasspath + sourceSets.main.output
        destinationDirectory = layout.buildDirectory.dir('ghidra-script-classes')
        options.encoding = 'UTF-8'
    }
    tasks.named('check') { dependsOn 'compileGhidraScripts' }
    tasks.named('buildExtension', Zip) {
        dependsOn 'check'
        from(licenseFiles) { into project.name }
        archiveVersion.set('')
        preserveFileTimestamps = false
        reproducibleFileOrder = true
    }
}

subprojects {
    version = rootProject.version
    repositories { mavenCentral() }
    tasks.withType(AbstractArchiveTask).configureEach {
        preserveFileTimestamps = false
        reproducibleFileOrder = true
    }
    plugins.withType(JavaPlugin) {
        tasks.named('jar') {
            archiveVersion.set('')
            from(licenseFiles) { into 'META-INF' }
        }
        java { toolchain { languageVersion = JavaLanguageVersion.of(25) } }
        dependencies {
            testImplementation platform('org.junit:junit-bom:6.1.3')
            testImplementation 'org.junit.jupiter:junit-jupiter'
            testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
        }
        tasks.withType(JavaCompile).configureEach {
            options.encoding = 'UTF-8'
            options.compilerArgs += ['-Xlint:all', '-Werror']
        }
        tasks.withType(Test).configureEach {
            useJUnitPlatform()
            jvmArgs '--enable-native-access=ALL-UNNAMED'
        }
    }
}

tasks.named('check') { dependsOn subprojects.collect { it.path + ':check' } }
tasks.register('packageExtensions') {
    group = 'build'
    if (extensions.isEmpty()) {
        doLast { throw new GradleException('Specify -PghidraInstallDir=/path/to/ghidra') }
    } else {
        dependsOn extensions.collect { it.path + ':packageExtension' }
    }
}
defaultTasks 'check'
