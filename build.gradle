plugins {
    id 'base'
}

def installDir = providers.gradleProperty('ghidraInstallDir').orNull
if (!installDir) {
    throw new GradleException('Specify -PghidraInstallDir=/path/to/ghidra')
}
def ghidraBuild = file(installDir + '/support/buildExtension.gradle').canonicalFile
if (!ghidraBuild.isFile()) {
    throw new GradleException('Not a Ghidra distribution: ' + ghidraBuild.parentFile.parentFile)
}

subprojects {
    apply from: ghidraBuild

    repositories { mavenCentral() }
    dependencies {
        testImplementation platform('org.junit:junit-bom:6.1.3')
        testImplementation 'org.junit.jupiter:junit-jupiter'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }
    tasks.named('test', Test) { useJUnitPlatform() }
    tasks.register('compileGhidraScripts', JavaCompile) {
        source = fileTree('ghidra_scripts') { include '**/*.java' }
        classpath = sourceSets.main.compileClasspath + sourceSets.main.output
        destinationDirectory = layout.buildDirectory.dir('ghidra-script-classes')
        options.encoding = 'UTF-8'
    }
    tasks.named('check') { dependsOn 'compileGhidraScripts' }
    tasks.named('buildExtension', Zip) {
        dependsOn 'check'
        preserveFileTimestamps = true
    }
}

tasks.named('check') { dependsOn ':VnaolteFirmware:check', ':mtk-mddb-tools:check' }
tasks.register('packageExtensions') {
    group = 'build'
    description = 'Test and package both independent Ghidra extensions'
    dependsOn ':VnaolteFirmware:packageExtension', ':mtk-mddb-tools:packageExtension'
}
defaultTasks 'packageExtensions'
