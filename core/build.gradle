plugins { id 'java-library' }

def os = System.getProperty('os.name').toLowerCase(Locale.ROOT)
def hostPlatform = os.contains('win') ? 'win64' :
    (os.contains('mac') || os.contains('darwin') ? 'osx' :
    (os.contains('linux') ? 'linux64' : null))
def selectedPlatform = providers.gradleProperty('rocksdbPlatform').orElse(hostPlatform ?: 'unsupported').get()
if (!(selectedPlatform in ['linux64', 'win64', 'osx'])) {
    throw new GradleException('Unsupported RocksDB platform: ' + selectedPlatform)
}
ext.rocksPlatform = selectedPlatform

dependencies {
    api "org.rocksdb:rocksdbjni:11.1.1:${selectedPlatform}"
    implementation 'org.tukaani:xz:1.10'
}
tasks.named('jar') { archiveBaseName = 'mtk-mddb-core' }
