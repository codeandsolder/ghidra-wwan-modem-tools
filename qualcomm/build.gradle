def extensionArchive = tasks.named('buildExtension', Zip)
tasks.register('packageExtension', Exec) {
    group = 'build'
    description = 'Build and verify the Qualcomm extension archive'
    dependsOn extensionArchive
    inputs.file extensionArchive.flatMap { it.archiveFile }
    doFirst {
        commandLine 'bash', file('ci/verify-package.sh').absolutePath,
            extensionArchive.get().archiveFile.get().asFile.absolutePath
    }
}
