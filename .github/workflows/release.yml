name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  java-quality:
    uses: codeandsolder/ci-workflows/.github/workflows/source-quality.yml@ce05e1ab3124112fcd04a34d0b365a880ebed4bd # main
  release:
    needs: java-quality
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: ghidra
        uses: ./.github/actions/setup-ghidra
      - name: Test and build all release packages
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^releaseVersion=//p' gradle.properties)
          test "$GITHUB_REF_NAME" = "v$version"
          ci/package-release.sh "${{ steps.ghidra.outputs.install-dir }}" dist
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --notes-file CHANGELOG.md --title "$GITHUB_REF_NAME"
