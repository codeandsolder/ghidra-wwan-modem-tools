name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  java-quality:
    uses: codeandsolder/ci-workflows/.github/workflows/java-quality.yml@cef9ed17f08f76279ca9faa66faee1ceccc50a97 # main
  release:
    needs: java-quality
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: ghidra
        uses: ./.github/actions/setup-ghidra
      - name: Test and build all release packages
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon check :cli:distZip -ProcksdbPlatform=linux64
          ./gradlew --no-daemon -PghidraInstallDir="${{ steps.ghidra.outputs.install-dir }}" -ProcksdbPlatform=linux64 packageExtensions
          for platform in win64 osx; do
            ./gradlew --no-daemon -PghidraInstallDir="${{ steps.ghidra.outputs.install-dir }}" -ProcksdbPlatform="$platform" :mtk-mddb-tools:packageExtension :cli:distZip -x :mtk-mddb-tools:test -x :core:test -x :cli:test
          done
          mkdir dist
          cp qualcomm/dist/*.zip mediatek/dist/*.zip cli/build/distributions/*.zip dist/
          (cd dist && sha256sum *.zip > SHA256SUMS)
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
