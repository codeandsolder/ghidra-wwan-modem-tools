name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  extensions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: ghidra
        uses: ./.github/actions/setup-ghidra
      - name: Dry-run the release packaging
        run: ci/package-release.sh "${{ steps.ghidra.outputs.install-dir }}" dist
  source-quality:
    uses: codeandsolder/ci-workflows/.github/workflows/source-quality.yml@ce05e1ab3124112fcd04a34d0b365a880ebed4bd # main
  renovate-config:
    uses: codeandsolder/ci-workflows/.github/workflows/renovate-config.yml@cef9ed17f08f76279ca9faa66faee1ceccc50a97 # main
  cli:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - shell: bash
        run: ./gradlew --no-daemon check :cli:installDist :cli:distZip
      - if: runner.os != 'Windows'
        shell: bash
        run: cli/build/install/mtk-mddb-cli-*/bin/mtk-mddb --help
      - if: runner.os == 'Windows'
        shell: cmd
        run: cli\build\install\mtk-mddb-cli-win64\bin\mtk-mddb.bat --help
