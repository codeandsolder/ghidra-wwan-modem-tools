name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  extensions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: ghidra
        uses: ./.github/actions/setup-ghidra
      - name: Verify and package both extensions
        run: ./gradlew --no-daemon -PghidraInstallDir="${{ steps.ghidra.outputs.install-dir }}" -ProcksdbPlatform=linux64 packageExtensions
  source-quality:
    uses: codeandsolder/ci-workflows/.github/workflows/source-quality.yml@ce05e1ab3124112fcd04a34d0b365a880ebed4bd # main
  renovate-config:
    uses: codeandsolder/ci-workflows/.github/workflows/renovate-config.yml@cef9ed17f08f76279ca9faa66faee1ceccc50a97 # main
  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - run: ./gradlew --no-daemon check :cli:installDist :cli:distZip
      - run: cli/build/install/mtk-mddb-cli-linux64/bin/mtk-mddb --help
